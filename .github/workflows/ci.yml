name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update dependencies
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check
        run: moon check --target native --deny-warn
      - name: Unit tests and QuickCheck properties
        run: moon test --target native
      - name: Run fixture baseline
        run: moon -C fixtures/basic test
      - name: Run turtles against fixture
        run: |
          report="$RUNNER_TEMP/turtles-report.json"
          moon run cmd/turtles -- --dir fixtures/basic --timeout 30 --json "$report"
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema"] == 2
          assert report["gates"] == ["check", "test"]
          assert len(report["mutants"]) == 6
          assert any(
              mutant["original"] == "flag" and mutant["replacement"] == "true"
              for mutant in report["mutants"]
          )
          assert any(
              mutant["original"] == "flag" and mutant["replacement"] == "false"
              for mutant in report["mutants"]
          )
          assert report["summary"]["survived"] == 0
          assert report["summary"]["timeout"] == 0
          assert report["summary"]["unviable"] == 0
          assert all("duration_ms" in mutant for mutant in report["mutants"])
          assert all(mutant["gate"] == "test" for mutant in report["mutants"])
          PY
      - name: List self-mutation candidates
        run: moon run cmd/turtles -- --dir . --list
      - name: Self-mutation on report.mbt (all gates incl. mutated-binary E2E)
        run: |
          report="$RUNNER_TEMP/turtles-self-report.json"
          moon run cmd/turtles -- --dir . --file report.mbt --timeout 300 --json "$report"
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema"] == 2
          assert report["gates"] == ["check", "test", "self-e2e"]
          assert len(report["mutants"]) > 0
          assert report["summary"]["survived"] == 0, report["mutants"]
          assert report["summary"]["timeout"] == 0, report["mutants"]
          assert all(
              mutant["gate"] in ("check", "test", "self-e2e")
              for mutant in report["mutants"]
          )
          PY
      - name: Self-mutation sweep on main.mbt (informational; audits gate attribution)
        run: |
          report="$RUNNER_TEMP/turtles-self-main.json"
          # Survivors are expected for empty-input guards; list them instead
          # of failing until the self-mutation baseline is established.
          moon run cmd/turtles -- --dir . --file main.mbt --timeout 300 --json "$report" || true
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema"] == 2
          assert report["gates"] == ["check", "test", "self-e2e"]
          assert len(report["mutants"]) > 0
          unresolved = [
              mutant for mutant in report["mutants"]
              if mutant["outcome"] != "KILLED"
          ]
          for mutant in unresolved:
              print("unresolved mutant:", mutant)
          print("self-mutation summary:", report["summary"])
          PY
