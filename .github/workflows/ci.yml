name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update dependencies
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Assert version consistency
        run: |
          mod_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' moon.mod)
          cli_version=$(sed -n 's/.*turtles_version *: *String *= *"\(.*\)".*/\1/p' cmd/turtles/config.mbt)
          if [ -z "$mod_version" ] || [ -z "$cli_version" ]; then
            echo "failed to extract version: moon.mod='$mod_version' turtles_version='$cli_version'"
            exit 1
          fi
          if [ "$mod_version" != "$cli_version" ]; then
            echo "moon.mod version ($mod_version) != turtles_version ($cli_version)"
            exit 1
          fi
      - name: Validate publishable package
        run: moon package --list
      - name: Check
        run: moon check --target native --deny-warn
      - name: Unit tests
        run: moon test --target native
      - name: Run fixture baseline
        run: moon -C fixtures/basic test
      - name: Run isolation fixture baseline
        run: moon -C fixtures/isolation test
      - name: Run empty fixture baseline
        run: moon -C fixtures/empty test
      - name: Run turtles against fixture
        run: |
          report="$RUNNER_TEMP/turtles-report.json"
          moon run cmd/turtles -- --dir fixtures/basic --timeout 30 --json "$report"
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema"] == 3
          assert len(report["mutants"]) == 6
          assert any(
              mutant["original"] == "flag" and mutant["replacement"] == "true"
              for mutant in report["mutants"]
          )
          assert any(
              mutant["original"] == "flag" and mutant["replacement"] == "false"
              for mutant in report["mutants"]
          )
          assert report["summary"]["survived"] == 0
          assert report["summary"]["timeout"] == 0
          assert all("duration_ms" in mutant for mutant in report["mutants"])
          PY
      - name: Run turtles against isolation fixture
        run: |
          report="$RUNNER_TEMP/turtles-isolation-report.json"
          status=0
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --json "$report" || status=$?
          test "$status" -eq 1
          parallel="$RUNNER_TEMP/turtles-isolation-parallel.json"
          status=0
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --jobs 4 --json "$parallel" || status=$?
          test "$status" -eq 1
          python - "$report" "$parallel" <<'PY'
          import json
          import sys

          def key(mutant):
              return (
                  mutant["path"],
                  mutant["line"],
                  mutant["column"],
                  mutant["original"],
                  mutant["replacement"],
                  mutant["outcome"],
                  mutant["group"],
              )

          reports = []
          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as handle:
                  reports.append(json.load(handle))
          for report in reports:
              summary = report["summary"]
              assert summary["killed"] == 3, summary
              assert summary["survived"] == 3, summary
              assert summary["unviable"] == 0, summary
              assert summary["timeout"] == 0, summary
              assert report["schema"] == 3
              assert all("group" in mutant for mutant in report["mutants"])
          sequential = [key(m) for m in reports[0]["mutants"]]
          concurrent = [key(m) for m in reports[1]["mutants"]]
          assert sequential == concurrent  # parallel runs keep discovery order
          PY
      - name: Target-aware runs on the targets fixture
        run: |
          # --list filters by Moon's own per-backend plan: native lists
          # common+native, js lists common+js, all unions them.
          moon run cmd/turtles -- --dir fixtures/targets --target native --list \
            | tee "$RUNNER_TEMP/turtles-list-native.txt"
          grep -q 'common.mbt:' "$RUNNER_TEMP/turtles-list-native.txt"
          grep -q 'native_only.mbt:' "$RUNNER_TEMP/turtles-list-native.txt"
          ! grep -q 'js_only.mbt:' "$RUNNER_TEMP/turtles-list-native.txt"
          grep -q 'target-inactive: js_only.mbt' "$RUNNER_TEMP/turtles-list-native.txt"
          moon run cmd/turtles -- --dir fixtures/targets --target js --list \
            | tee "$RUNNER_TEMP/turtles-list-js.txt"
          grep -q 'common.mbt:' "$RUNNER_TEMP/turtles-list-js.txt"
          grep -q 'js_only.mbt:' "$RUNNER_TEMP/turtles-list-js.txt"
          ! grep -q 'native_only.mbt:' "$RUNNER_TEMP/turtles-list-js.txt"
          moon run cmd/turtles -- --dir fixtures/targets --target all --list \
            | tee "$RUNNER_TEMP/turtles-list-all.txt"
          grep -q 'common.mbt:' "$RUNNER_TEMP/turtles-list-all.txt"
          grep -q 'native_only.mbt:' "$RUNNER_TEMP/turtles-list-all.txt"
          grep -q 'js_only.mbt:' "$RUNNER_TEMP/turtles-list-all.txt"
          # A native run classifies common+native mutants; js mutants are
          # reported target-inactive and excluded from the score.
          report="$RUNNER_TEMP/turtles-targets.json"
          out="$RUNNER_TEMP/turtles-targets-out"
          moon run cmd/turtles -- --dir fixtures/targets --target native --timeout 60 \
            --json "$report" --output-dir "$out"
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema"] == 3
          assert report["target"] == "native"
          assert report["inactive_mutants"] == 1
          assert report["inactive_files"] == ["js_only.mbt"]
          assert all(
              mutant["path"] in ("common.mbt", "native_only.mbt")
              for mutant in report["mutants"]
          )
          assert report["summary"]["killed"] == len(report["mutants"])
          assert report["summary"]["survived"] == 0
          PY
          # A js run with --iterate against the same output dir must not
          # reuse a single native verdict: prior.target mismatches.
          moon run cmd/turtles -- --dir fixtures/targets --target js --iterate \
            --timeout 60 --output-dir "$out" 2>&1 \
            | tee "$RUNNER_TEMP/turtles-iterate-js.txt"
          grep -q "reusing 0/" "$RUNNER_TEMP/turtles-iterate-js.txt"
      - name: fail-under gates on the mutation score
        run: |
          # The isolation fixture scores 50%: a threshold at the score passes
          # despite the survivors, and one above it fails.
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --fail-under 50
          status=0
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --fail-under 51 || status=$?
          test "$status" -eq 1
          status=0
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --fail-under -1 || status=$?
          test "$status" -eq 2
          status=0
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --fail-under 101 || status=$?
          test "$status" -eq 2
      - name: Smoke-test the installed binary
        run: |
          bin="$RUNNER_TEMP/turtles-bin"
          moon install ./cmd/turtles --bin "$bin"
          "$bin/turtles" --version
          "$bin/turtles" --help
          "$bin/turtles" --dir fixtures/basic --list
      - name: Smoke-test the published Mooncakes release
        # The version in moon.mod may not be published yet (e.g. a release
        # bump PR before `moon publish`). Skipping in that case keeps PR CI
        # green without requiring a pre-merge registry publication; once the
        # version exists, any CI run verifies the published artifact.
        run: |
          mod_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' moon.mod)
          curl -fsSL "https://mooncakes.io/api/v0/modules/f4ah6o/turtles" \
            -o "$RUNNER_TEMP/mooncakes.json"
          if jq -e --arg v "$mod_version" \
              '.versions[] | select(.version == $v and (.yanked | not))' \
              "$RUNNER_TEMP/mooncakes.json" > /dev/null; then
            bin="$RUNNER_TEMP/turtles-mooncakes-bin"
            moon install "f4ah6o/turtles/cmd/turtles@$mod_version" --bin "$bin"
            test "$("$bin/turtles" --version)" = "turtles $mod_version"
          else
            echo "f4ah6o/turtles@$mod_version is not published yet; skipping"
          fi
      - name: Emit JSON report for empty candidate sets
        run: |
          report="$RUNNER_TEMP/turtles-empty-report.json"
          moon run cmd/turtles -- --dir fixtures/empty --json "$report"
          filtered="$RUNNER_TEMP/turtles-filtered-report.json"
          moon run cmd/turtles -- --dir fixtures/basic --file no-such-source --json "$filtered"
          python - "$report" "$filtered" <<'PY'
          import json
          import sys

          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as handle:
                  report = json.load(handle)
              assert report["schema"] == 3
              assert report["mutants"] == []
              assert report["summary"]["killed"] == 0
              assert report["summary"]["survived"] == 0
              assert report["summary"]["timeout"] == 0
              assert report["summary"]["unviable"] == 0
              assert int(report["baseline_duration_ms"]) >= 0
          PY
